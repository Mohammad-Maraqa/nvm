name: Diagnose implicit alias fast-suite result
on:
  push:
    branches: [validation/implicit-alias-diagnostic]
    paths: [.github/workflows/alias-validation.yml]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'Mohammad-Maraqa/nvm' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify final source and prepare tools without hooks
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin c7c0a732b1f0dd87b83a178c3cc011e4ba8823d6 970ed9ea18ba51b2f55b9da585b801e06318b0a0
          git diff --exit-code c7c0a732b1f0dd87b83a178c3cc011e4ba8823d6 HEAD -- nvm.sh test package.json .gitmodules
          git config submodule.test/fixtures/nvmrc.url https://github.com/nvm-sh/nvmrc.git
          git submodule update --init --depth=1
          sudo apt-get update
          sudo apt-get install -y zsh gawk mawk shellcheck
          node --version
          npm --version
          npm install --ignore-scripts --no-audit --no-fund
          npm ls urchin
          npm run test:check-exec
      - name: Final focused matrix and full patched versus baseline Bash gawk
        run: |
          set -euo pipefail
          for bin in node npm npx; do
            if test -f "/usr/local/bin/$bin"; then sudo mv "/usr/local/bin/$bin" "/usr/local/bin/$bin.nvm-review-hidden"; fi
          done
          export PATH="$(printf '%s' "$PATH" | tr ':' '\n' | grep -v '\.nvm' | grep -v 'toolcache' | tr '\n' ':')"
          unset NVM_CD_FLAGS NVM_BIN NVM_INC
          export NVM_DIR="$PWD"
          result=0
          for awkbin in gawk mawk; do
            sudo update-alternatives --set awk "/usr/bin/$awkbin"
            for shell in bash dash sh zsh; do
              for file in 'nvm_print_implicit_alias classification' 'nvm_print_implicit_alias success' 'nvm_print_implicit_alias errors' nvm_validate_implicit_alias; do
                set +e
                (cd 'test/fast/Unit tests' && timeout 45s "$shell" "$file")
                status=$?
                set -e
                echo "FOCUSED shell=$shell awk=$awkbin file=$file exit=$status"
                if test "$status" -ne 0; then result=1; fi
              done
            done
          done
          sudo update-alternatives --set awk /usr/bin/gawk
          cp nvm.sh "$RUNNER_TEMP/final-nvm.sh"
          regression='test/fast/Unit tests/nvm_print_implicit_alias classification'
          cp "$regression" "$RUNNER_TEMP/final-classification"
          for revision in final baseline; do
            if test "$revision" = baseline; then
              git show 970ed9ea18ba51b2f55b9da585b801e06318b0a0:nvm.sh > nvm.sh
              mv "$regression" "$RUNNER_TEMP/withheld-classification"
            fi
            set +e
            timeout 8m make TERM=xterm-256color TEST_SUITE=fast SHELL=bash URCHIN="$PWD/node_modules/.bin/urchin" test-bash > "$RUNNER_TEMP/$revision-full.log" 2>&1
            status=$?
            set -e
            echo "FULL_BEGIN revision=$revision exit=$status"
            cat "$RUNNER_TEMP/$revision-full.log"
            echo "FULL_END revision=$revision exit=$status"
            find . -name .urchin.log -type f -print -exec cat {} \;
            cp "$RUNNER_TEMP/final-nvm.sh" nvm.sh
            if test "$revision" = baseline; then mv "$RUNNER_TEMP/withheld-classification" "$regression"; fi
          done
          git diff --exit-code c7c0a732b1f0dd87b83a178c3cc011e4ba8823d6 -- nvm.sh test
          exit "$result"
      - name: Compare unchanged shellcheck diagnostics
        if: always()
        run: |
          set -euo pipefail
          git show 970ed9ea18ba51b2f55b9da585b801e06318b0a0:nvm.sh > "$RUNNER_TEMP/baseline-nvm.sh"
          for revision in baseline final; do
            file=nvm.sh
            if test "$revision" = baseline; then file="$RUNNER_TEMP/baseline-nvm.sh"; fi
            for shell in bash sh dash ksh; do
              set +e
              shellcheck -f gcc -s "$shell" "$file"
              status=$?
              set -e
              echo "SHELLCHECK revision=$revision shell=$shell exit=$status"
            done
          done
      - name: Restore runner-owned hidden executables
        if: always()
        run: |
          for bin in node npm npx; do
            if test -f "/usr/local/bin/$bin.nvm-review-hidden"; then sudo mv "/usr/local/bin/$bin.nvm-review-hidden" "/usr/local/bin/$bin"; fi
          done
