name: Validate implicit alias with official PTY harness
on:
  push:
    branches: [validation/implicit-alias-tty]
    paths: [.github/workflows/alias-validation.yml]
permissions:
  contents: read
jobs:
  tty:
    if: github.repository == 'Mohammad-Maraqa/nvm' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify frozen source and prepare dependencies without hooks
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin c7c0a732b1f0dd87b83a178c3cc011e4ba8823d6
          git diff --exit-code c7c0a732b1f0dd87b83a178c3cc011e4ba8823d6 HEAD -- nvm.sh test package.json .gitmodules
          git config submodule.test/fixtures/nvmrc.url https://github.com/nvm-sh/nvmrc.git
          git submodule update --init --depth=1
          sudo apt-get update
          sudo apt-get install -y zsh gawk mawk
          node --version
          npm --version
          npm install --ignore-scripts --no-audit --no-fund
          npm ls urchin
          npm run test:check-exec
      - name: Official PTY harness full Bash gawk and exact terminal matrix
        run: |
          set -euo pipefail
          for bin in node npm npx; do
            if test -f "/usr/local/bin/$bin"; then sudo mv "/usr/local/bin/$bin" "/usr/local/bin/$bin.nvm-review-hidden"; fi
          done
          export PATH="$(printf '%s' "$PATH" | tr ':' '\n' | grep -v '\.nvm' | grep -v 'toolcache' | tr '\n' ':')"
          unset NVM_CD_FLAGS NVM_BIN NVM_INC
          export NVM_DIR="$PWD"
          result=0
          sudo update-alternatives --set awk /usr/bin/gawk
          set +e
          script -q -e -c 'timeout 8m make TERM=xterm-256color TEST_SUITE=fast SHELL=bash URCHIN="$PWD/node_modules/.bin/urchin" test-bash' /dev/null > "$RUNNER_TEMP/full-tty.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/full-tty.log"
          echo "FULL_TTY shell=bash awk=gawk exit=$status"
          find . -name .urchin.log -type f -print -exec cat {} \;
          if test "$status" -ne 0; then result=1; fi
          for awkbin in gawk mawk; do
            sudo update-alternatives --set awk "/usr/bin/$awkbin"
            for shell in bash dash sh zsh; do
              set +e
              (cd 'test/fast/Unit tests' && script -q -e -c "timeout 30s $shell nvm_stdout_is_terminal" /dev/null)
              status=$?
              set -e
              echo "TERMINAL_TTY shell=$shell awk=$awkbin exit=$status"
              if test "$status" -ne 0; then result=1; fi
            done
          done
          git diff --exit-code c7c0a732b1f0dd87b83a178c3cc011e4ba8823d6 -- nvm.sh test
          exit "$result"
      - name: Restore runner-owned hidden executables
        if: always()
        run: |
          for bin in node npm npx; do
            if test -f "/usr/local/bin/$bin.nvm-review-hidden"; then sudo mv "/usr/local/bin/$bin.nvm-review-hidden" "/usr/local/bin/$bin"; fi
          done
